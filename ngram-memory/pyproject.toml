[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ngram_memory"
version = "0.0.1"
description = "Portable row writer for native and grafted n-gram tables (Flash-Next PLE format)."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
train = ["torch>=2.4", "transformers>=5.22", "safetensors>=0.4"]
dev = ["pytest>=8", "pytest-xdist>=3"]

[tool.setuptools.packages.find]
include = ["ngram_memory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: real-weight or long-running proofs (deselect with -m 'not slow')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
